on:
  workflow_run:
    workflows: ["Run-Web-Pytest"]
    branches: ["main"]
    types: ["completed"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout-repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup SSH agent #秘密鍵のssh-agentへの登録
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add Host to known_hosts #VPSのホスト公開鍵をknown_hostsに登録
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_HOST_KEY }}" >> ~/.ssh/known_hosts

      - name: Deploy backend to staging #rsyncによるバックエンドファイルの差分転送でデプロイ
        run: | #|で複数行のコマンドと指定 
          rsync -avz \
            --exclude='.env' \
            --exclude='.venv/' \
            --exclude='__pycache__/' \
            --exclude='webserver.sh' \
            --exclude='venv.sh' \
            web/vps-web/backend/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/murabito/deploy-staging/backend/

      - name: Deploy backend to Production #本番環境/opt/webquizへのデプロイ
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "sudo -n rsync -avz \
            --exclude='.env' \
            --exclude='.venv/' \
            --exclude='__pycache__/' \
            --exclude='venv.sh' \
            --chown=root:webquiz \
            /home/murabito/deploy-staging/backend/ \
            /opt/webquiz/"


      - name: Build frontend
        run: |
          cd web/vps-web/frontend
          npm ci
          npm run build

      - name: Deploy frontend via rsync #フロントエンド差分転送
        run: |
          rsync -avz \
            web/vps-web/frontend/dist/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/webquiz/
    
      - name: Install Python Dependencies
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "sudo -n -u deploy /opt/webquiz/.venv/bin/python3 -m pip install -r /opt/webquiz/requirements.txt"


      - name: Restart services
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "sudo -n systemctl restart webquiz.service && echo 'Restarted'"

